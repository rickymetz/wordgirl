[build]
  command = "npm run build"
  publish = "dist"

# Block WordPress scanner bots — these return 404 instead of serving
# the SPA, so they stop inflating pageview counts.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

# Common CMS/framework scanner paths
[[redirects]]
  from = "/administrator/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404

# Double-slash prefix probes (wp-includes/wlwmanifest.xml scanners)
[[redirects]]
  from = "//test/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//blog/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//shop/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wp/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wp-includes/*"
  to = "/404.html"
  status = 404

# SPA catch-all — must come AFTER the bot blockers
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
