[build]
  command = "npm run build"
  publish = "dist"

# Block WordPress scanner bots — these return 404 instead of serving
# the SPA, so they stop inflating pageview counts.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

# Common CMS/framework scanner paths
[[redirects]]
  from = "/administrator/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404

# Double-slash prefix probes (wp-includes/wlwmanifest.xml scanners)
[[redirects]]
  from = "//test/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//blog/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//shop/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wp/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wp-includes/*"
  to = "/404.html"
  status = 404

# Docs — proxied from the GitHub Pages deploy (base "/docs"), so the
# site lives at wordgirl.net/docs with no DNS or extra host. Custom
# headers below do NOT apply to proxied responses, which is deliberate:
# the docs need inline styles/scripts the app CSP forbids.
#
# KNOWN GAP, and the reason to prefer a subdomain eventually: proxied at
# status 200, these pages run in wordgirl.net's ORIGIN. Any script on
# them can read the app's localStorage — every saved day, every streak.
# Same author, same repo, so the practical risk is small, but the docs
# are inside the app's security boundary rather than beside it, and no
# header written here can move them out. Only a separate host can
# (docs.wordgirl.net, or the github.io URL unproxied). The block below
# restores what a proxy CAN carry if Netlify applies it; treat it as
# defence in depth, not as the fix.
# No /docs -> /docs/ self-redirect: Netlify's slash normalization
# turns that into an infinite loop. Proxy both forms directly.
[[redirects]]
  from = "/docs"
  to = "https://rickymetz.github.io/wordgirl/"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "https://rickymetz.github.io/wordgirl/:splat"
  status = 200

# SPA catch-all — must come AFTER the bot blockers and the docs proxy
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.usefathom.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cdn.usefathom.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'"

# Docs — same protections as the app minus the CSP, which Starlight's
# inline styles and scripts would break. See the proxy note above for
# why this is defence in depth and not the fix.
[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed assets are immutable — cache for one year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shell (index.html) and service worker must always revalidate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
