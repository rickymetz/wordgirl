[build]
  command = "npm run build"
  publish = "dist"

# Block WordPress scanner bots — these return 404 instead of serving
# the SPA, so they stop inflating pageview counts.
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

# Common CMS/framework scanner paths
[[redirects]]
  from = "/administrator/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.php"
  to = "/404.html"
  status = 404

# Double-slash prefix probes (wp-includes/wlwmanifest.xml scanners)
[[redirects]]
  from = "//test/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//blog/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//shop/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wp/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "//wp-includes/*"
  to = "/404.html"
  status = 404

# SPA catch-all — must come AFTER the bot blockers
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.usefathom.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cdn.usefathom.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'"

# Hashed assets are immutable — cache for one year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shell (index.html) and service worker must always revalidate
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
