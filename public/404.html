<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Found — WordGirl</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      background: light-dark(#ffffff, #121116);
      color: light-dark(#26242b, #eceaf0);
    }
    .card {
      text-align: center;
      max-width: 20rem;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.5rem;
      color: light-dark(#6f6b78, #98939f);
    }
    p {
      font-size: 1.125rem;
      color: light-dark(#6f6b78, #98939f);
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      background: light-dark(#26242b, #eceaf0);
      color: light-dark(#ffffff, #121116);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>This page doesn't exist.</p>
    <a href="/">Back to WordGirl</a>
  </div>
</body>
</html>
