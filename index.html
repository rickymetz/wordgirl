<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WordGirl</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- default (not black-translucent): translucent draws WHITE glyphs
         over the app's white light-theme surface — unreadable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WordGirl" />
    <meta
      name="description"
      content="A little collection of word games — a new puzzle every day."
    />
    <!-- Social cards (host must be absolute for scrapers). -->
    <meta property="og:title" content="WordGirl" />
    <meta
      property="og:description"
      content="A little collection of word games — a new puzzle every day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wordgirl.net/" />
    <meta property="og:image" content="https://wordgirl.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordGirl" />
    <meta
      name="twitter:description"
      content="A little collection of word games — a new puzzle every day."
    />
    <meta name="twitter:image" content="https://wordgirl.net/og.png" />
    <!-- Pre-JS mirror of applySettings (src/lib/settings.ts): the
         bundle re-applies these on mount, but on the slow connection
         the boot screen exists for that is seconds away, and a
         forced-dark player would stare at a white skeleton until then.
         Same storage key, same <html> hooks, same theme-color rewrite;
         src/lib/bootMirror.test.ts pins the copies to settings.ts.
         sha256 pinned in netlify.toml; cspHashGuard enforces it. Must
         sit AFTER the theme-color metas it rewrites. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("wg:v1:local:settings"));
          if (!s) return;
          var root = document.documentElement;
          if (s.theme === "light" || s.theme === "dark") {
            root.dataset.theme = s.theme;
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++)
              metas[i].content = s.theme === "dark" ? "#121116" : "#ffffff";
          }
          if ([87.5, 112.5, 125].indexOf(s.fontScale) !== -1)
            root.style.fontSize = s.fontScale + "%";
          if (s.font === "accessible") root.dataset.font = s.font;
        } catch (e) {}
      })();
    </script>
    <!-- The boot screen's whole stylesheet, inline so it paints from
         the HTML alone — the app stylesheet is render-blocking and on
         a cold slow connection arrives long after this document, which
         is exactly the boot the screen exists for. Self-contained on
         purpose: the --boot-* tokens MIRROR index.css (--color-surface,
         -raised, -ink, -ink-soft, -line, the root accent, and the
         surface-tint mix at the neutral accent) because the real
         tokens live in the file that may not have arrived; the html/
         body/#root rules mirror index.css likewise and resolve to the
         same values when both apply; src/lib/bootMirror.test.ts pins
         every mirrored value. Staging, a11y and layout rationale: see
         the boot markup below. sha256 pinned in netlify.toml;
         cspHashGuard enforces it. -->
    <style>
      html {
        color-scheme: light dark;
        --boot-surface: light-dark(#ffffff, #121116);
        --boot-raised: light-dark(#ffffff, #211f26);
        --boot-ink: light-dark(#26242b, #eceaf0);
        --boot-ink-soft: light-dark(#6f6b78, #98939f);
        --boot-line: light-dark(#e3e0d9, #322f38);
        --boot-accent: light-dark(#171717, #e5e5e5);
        --boot-tint: light-dark(
          color-mix(in oklab, #171717 6%, #ffffff),
          color-mix(in oklab, #e5e5e5 13%, #211f26)
        );
      }
      html[data-theme="light"] { color-scheme: light; }
      html[data-theme="dark"] { color-scheme: dark; }
      @media (min-width: 768px) {
        html { font-size: 18px; }
      }
      body { margin: 0; }
      #root {
        /* border-box keeps the safe-area padding INSIDE the 100dvh
           (mirrors index.css). It normally comes from Tailwind's
           preflight — which is in the stylesheet that hasn't arrived —
           and without it a notched phone gets insets + 100dvh and the
           boot screen page-scrolls, then jumps when the CSS lands. */
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      #boot-fallback {
        position: relative;
        flex: 1;
        width: 100%;
        background: var(--boot-surface);
        color: var(--boot-ink);
        /* The literal list is the no-stylesheet fallback (a var()
           fallback may contain commas) and mirrors
           --font-display-house; once index.css lands, the token wins,
           so the Font setting is honored mid-boot. */
        font-family: var(
          --font-display,
          "Avenir Next",
          "Avenir",
          ui-rounded,
          system-ui,
          sans-serif
        );
      }
      /* Bones mirror the hub's geometry — max-w-md/px-5/pt-12 (28rem,
         1.25rem, 3rem here), md:max-w-2xl + md:gap-8, rounded-3xl
         cards over w-[37%] action pills with the third clipped at the
         right edge exactly like the real scroller's "scroll for more"
         peek (see GameCard) — in the NEUTRAL root surface-tint; the
         real cards re-mix that token per game accent (data-level),
         which no-JS cannot know. The pulse lives on this container,
         not the bones: one composited layer instead of twenty. */
      /* The skeleton, spinner and stuck panel carry the hidden
         ATTRIBUTE as their no-CSS default: if this style block is ever
         refused (a stale CSP hash, an intermediary rewriting the HTML,
         an old engine without CSP3 style-element hashes), the [hidden]
         rule blanks them instead of dumping the 8s "Still loading"
         panel on every healthy load. Overriding [hidden] is a cascade
         puzzle: Tailwind's preflight ships [hidden] { display: none
         !important } in @layer base, which arrives WITH the app
         stylesheet while the bundle is still pending, and for
         !important declarations LAYERED beats unlayered and the
         EARLIEST layer beats later ones — so these display overrides
         live in their own layer, registered first in the document,
         which outranks base precisely and only where both are
         !important. The note stays un-hidden — bare "Loading…" text
         is the honest no-style state. */
      @layer boot {
        #boot-skeleton {
          display: flex !important;
        }
        html[data-boot="game"] #boot-skeleton {
          display: none !important;
        }
        #boot-spinner,
        #boot-stuck {
          display: block !important;
        }
      }
      #boot-skeleton {
        position: absolute;
        inset: 0;
        margin: 0 auto;
        max-width: 28rem;
        padding: 3rem 1.25rem 0;
        flex-direction: column;
        gap: 1.25rem;
        overflow: hidden;
        visibility: hidden;
        opacity: 0;
        animation:
          boot-reveal 0.3s ease 0.3s forwards,
          boot-pulse 1.8s ease-in-out 0.6s infinite;
      }
      @media (min-width: 768px) {
        #boot-skeleton {
          max-width: 42rem;
          gap: 2rem;
        }
      }
      /* data-boot="game" is stamped by the per-game OG shells
         (ogShells, vite.config.ts): those documents boot a GAME, so
         the hub-shaped skeleton would promise a layout the mount never
         delivers — they keep only the route-agnostic spinner + note.
         The hiding rule lives in the boot layer above. */
      .boot-bone {
        flex: none;
        background: var(--boot-tint);
        border-radius: 1.5rem;
      }
      .boot-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }
      .boot-bone-icon {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
      }
      .boot-bone-title {
        width: 9rem;
        height: 2rem;
        border-radius: 0.75rem;
      }
      .boot-game {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .boot-bone-card {
        /* Sized to the COLD state the skeleton actually precedes: on a
           never-played profile the real cards measure 136-176px at
           default text (played cards, ~206px, imply a warm cache that
           skips the skeleton). 9.5rem is the measured mean. */
        height: 9.5rem;
      }
      .boot-row {
        display: flex;
        gap: 0.75rem;
        overflow: hidden;
      }
      .boot-bone-pill {
        width: 37%;
        height: 2.75rem;
        border-radius: 1rem;
      }
      #boot-center {
        position: absolute;
        inset: 0;
        margin: 0 auto;
        /* Tracks the hub column (28rem) minus its px-5, so the stuck
           panel gets enough width that its body copy isn't chopped
           into slivers. */
        max-width: 25.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* When the column overflows (landscape, large zoom) plain
           center clips BOTH ends unreachably; safe center falls back
           to start and the overflow scrolls. */
        justify-content: safe center;
        overflow-y: auto;
        padding: 1.25rem;
        text-align: center;
      }
      #boot-spinner {
        /* flex: none — the overflowing column otherwise squashes the
           ring into a sliver before it starts to scroll. */
        flex: none;
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1rem;
        border-radius: 9999px;
        border: 3px solid var(--boot-line);
        border-top-color: var(--boot-ink);
        visibility: hidden;
        opacity: 0;
        animation:
          boot-reveal 0.3s ease 0.3s forwards,
          boot-spin 0.8s linear infinite;
      }
      /* On its own surface pill: ink-soft straight on a pulsing bone
         bottoms out at 4.05:1 in dark mode, under AA. An h1 so the
         page always has a heading naming its state, sized as body
         text. */
      #boot-note {
        font-size: 1rem;
        font-weight: 400;
        margin: 0;
        color: var(--boot-ink-soft);
        background: var(--boot-surface);
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        visibility: hidden;
        opacity: 0;
        animation: boot-reveal 0.3s ease 0.3s forwards;
      }
      /* House panel styling (raised + line border + shadow, like
         ModalDialog). Kept at zero size as well as hidden until its
         reveal so stage 1 centers on what is actually visible; the
         0s-duration keyframe jumps every property at the 8s mark. */
      #boot-stuck {
        visibility: hidden;
        opacity: 0;
        max-height: 0;
        overflow: hidden;
        margin-top: 0;
        padding: 0 1.5rem;
        border: 0 solid var(--boot-line);
        border-radius: 1.5rem;
        background: var(--boot-raised);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.1),
          0 8px 10px -6px rgb(0 0 0 / 0.1);
        animation: boot-stuck-reveal 0s linear 8s forwards;
      }
      #boot-stuck h2 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      #boot-stuck p {
        color: var(--boot-ink-soft);
        margin: 0 0 1rem;
        /* Even out the centered copy's line lengths — without it the
           last line wraps to a two-word orphan. */
        text-wrap: balance;
      }
      #boot-stuck a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        background: var(--boot-accent);
        color: var(--boot-surface);
        font-weight: 600;
        text-decoration: none;
      }
      @keyframes boot-reveal {
        to {
          visibility: visible;
          opacity: 1;
        }
      }
      @keyframes boot-stuck-reveal {
        to {
          visibility: visible;
          opacity: 1;
          max-height: none;
          margin-top: 1.5rem;
          padding: 1.5rem;
          border-width: 1px;
        }
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-pulse {
        50% { opacity: 0.55; }
      }
      /* Infinite animations are not stopped by index.css's global
         0.01ms duration — freeze the spin and the pulse by name.
         Shrinking animation-name to the reveal alone keeps the base
         shorthand's timing (extra values in the lists go inert), so
         the freeze can't drift from the source. */
      @media (prefers-reduced-motion: reduce) {
        #boot-spinner,
        #boot-skeleton {
          animation-name: boot-reveal;
        }
      }
    </style>
    <!-- No integrity attribute, deliberately: Fathom ships rolling
         updates to script.js, so a pinned SRI hash would silently kill
         analytics at their next deploy. The accepted tradeoff is that
         a compromise of their CDN runs in this origin; self-hosting a
         pinned copy is the upgrade path if that ever stops being
         acceptable. -->
    <script src="https://cdn.usefathom.com/script.js" data-site="SNVNKBMT" data-spa="auto" defer></script>
  </head>
  <body>
    <!-- Pre-mount boot screen. React replaces all of #root's children
         on mount, so this survives only while a boot is in flight or
         never lands. Its whole stylesheet is the inline style block in
         <head> — see the comments there. Two invariants the markup
         carries: the role="status" wrappers must stay in the tree
         unhidden (their children's visibility flip is what screen
         readers announce — and visibility, not just opacity, is what
         keeps the hidden Reload link out of the tab order and
         hit-testing, where a stray mid-screen tap would silently
         reload); and the hidden attributes are the fail-closed no-CSS
         default (see the style block). -->
    <div id="root">
      <div id="boot-fallback">
        <div id="boot-skeleton" aria-hidden="true" hidden>
          <div class="boot-head">
            <div class="boot-bone boot-bone-icon"></div>
            <div class="boot-bone boot-bone-title"></div>
            <div class="boot-bone boot-bone-icon"></div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
        </div>
        <div id="boot-center">
          <div id="boot-spinner" aria-hidden="true" hidden></div>
          <div role="status">
            <h1 id="boot-note">Loading…</h1>
          </div>
          <div role="status">
            <div id="boot-stuck" hidden>
              <h2>Still loading…</h2>
              <p>
                The app is taking longer than usual to arrive. Reloading is
                usually the fastest fix — or keep waiting if your connection
                is just slow.
              </p>
              <p><a href="">Reload</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
