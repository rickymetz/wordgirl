<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WordGirl</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- default (not black-translucent): translucent draws WHITE glyphs
         over the app's white light-theme surface — unreadable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WordGirl" />
    <meta
      name="description"
      content="A little collection of word games — a new puzzle every day."
    />
    <!-- Social cards (host must be absolute for scrapers). -->
    <meta property="og:title" content="WordGirl" />
    <meta
      property="og:description"
      content="A little collection of word games — a new puzzle every day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wordgirl.net/" />
    <meta property="og:image" content="https://wordgirl.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordGirl" />
    <meta
      name="twitter:description"
      content="A little collection of word games — a new puzzle every day."
    />
    <meta name="twitter:image" content="https://wordgirl.net/og.png" />
    <script src="https://cdn.usefathom.com/script.js" data-site="SNVNKBMT" data-spa="auto" defer></script>
  </head>
  <body>
    <!-- Pre-mount boot screen. React replaces all of #root's children
         on mount, so this survives only while a boot is in flight or
         never lands. Staging, constraints and rationale live with the
         styles: index.css, "Boot screen". The role="status" wrappers
         must stay in the tree unhidden — their children's visibility
         flip is what screen readers announce. -->
    <div id="root">
      <div id="boot-fallback">
        <div id="boot-skeleton" aria-hidden="true">
          <div class="boot-head">
            <div class="boot-bone boot-bone-icon"></div>
            <div class="boot-bone boot-bone-title"></div>
            <div class="boot-bone boot-bone-icon"></div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
          <div class="boot-game">
            <div class="boot-bone boot-bone-card"></div>
            <div class="boot-row">
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
              <div class="boot-bone boot-bone-pill"></div>
            </div>
          </div>
        </div>
        <div id="boot-center">
          <div id="boot-spinner" aria-hidden="true"></div>
          <div role="status">
            <h1 id="boot-note">Loading…</h1>
          </div>
          <div role="status">
            <div id="boot-stuck">
              <h2>Still loading…</h2>
              <p>
                The app is taking longer than usual to arrive. Reloading is
                usually the fastest fix — or keep waiting if your connection
                is just slow.
              </p>
              <p><a href="">Reload</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
