<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WordGirl</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- default (not black-translucent): translucent draws WHITE glyphs
         over the app's white light-theme surface — unreadable. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WordGirl" />
    <meta
      name="description"
      content="A little collection of word games — a new puzzle every day."
    />
    <!-- Social cards (host must be absolute for scrapers). -->
    <meta property="og:title" content="WordGirl" />
    <meta
      property="og:description"
      content="A little collection of word games — a new puzzle every day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wordgirl.net/" />
    <meta property="og:image" content="https://wordgirl.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordGirl" />
    <meta
      name="twitter:description"
      content="A little collection of word games — a new puzzle every day."
    />
    <meta name="twitter:image" content="https://wordgirl.net/og.png" />
    <script src="https://cdn.usefathom.com/script.js" data-site="SNVNKBMT" data-spa="auto" defer></script>
  </head>
  <body>
    <!-- createRoot().render() replaces these children, so the fallback
         only survives when the app never mounts — a chunk that 404s
         after a deploy, an evicted precache with no network. It is
         revealed by a pure-CSS delay (index.css) so a normal boot never
         flashes it, and it stays legible with no stylesheet at all,
         which is exactly the case it exists for. -->
    <div id="root">
      <div id="boot-fallback">
        <h1>WordGirl did not finish loading</h1>
        <p>Some of the app files did not arrive.</p>
        <p><a href="/">Reload</a></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
